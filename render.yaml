services:
  - type: web
    name: m4-books
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: waitress-serve --listen=0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: GOOGLE_DRIVE_API_KEY
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        value: 1IctnXWMu5IWqfFHjo9a_cyWvdFSBDfGP
